name: fleet-studio

services:
  studio:
    build: .
    ports:
      - '127.0.0.1:5173:5173'
      - '127.0.0.1:8787:8787'
    volumes:
      - fleet-data:/data
    # environment:
    #   FLEET_PASSPHRASE: change-me    # bridge then requires this; enter it once in Settings > Files
    #   FLEET_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    restart: unless-stopped

volumes:
  fleet-data:
    name: fleet-data
